<app-card variant="secondary" class="form-busca">
  <h2>Passagens</h2>
  <form>
    <div class="flex-container">
      <mat-button-toggle-group aria-label="Tipo de passagem">
        <mat-button-toggle>ida e volta</mat-button-toggle>
        <mat-button-toggle>somente ida</mat-button-toggle>
      </mat-button-toggle-group>
      <mat-chip-listbox (click)="openDialog()" class="horizontal-chips" aria-label="Color selection">
        @for (chip of availableColors; track chip) {
          <mat-chip-option [color]="chip.color">{{chip.name}}</mat-chip-option>
        }
      </mat-chip-listbox>
    </div>
    <div class="flex-container">
      <mat-form-field class="input-container" appearance="outline">
        <mat-label>Origem</mat-label>
        <mat-icon matPrefix>flight_takeoff</mat-icon>
        <input matInput placeholder="Origem">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <button mat-icon-button>
        <mat-icon>sync_alt</mat-icon>
      </button>
      <mat-form-field class="input-container" appearance="outline">
        <mat-label>Destino</mat-label>
        <mat-icon matPrefix>flight_land</mat-icon>
        <input matInput placeholder="Destino">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <mat-form-field color="primary">
        <mat-label>Data de ida</mat-label>
        <input matInput [matDatepicker]="pickerIda">
        <mat-datepicker-toggle matIconSuffix [for]="pickerIda"></mat-datepicker-toggle>
        <mat-datepicker #pickerIda></mat-datepicker>
      </mat-form-field>

      <mat-form-field color="primary">
        <mat-label>Data de volta</mat-label>
        <input matInput [matDatepicker]="pickerVolta">
        <mat-datepicker-toggle matIconSuffix [for]="pickerVolta"></mat-datepicker-toggle>
        <mat-datepicker #pickerVolta color="primary"></mat-datepicker>
      </mat-form-field>

      <button mat-flat-button color="primary">Buscar</button>
    </div>
  </form>
</app-card>
