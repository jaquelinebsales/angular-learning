<mat-card class="mat-elevation-z4" style="max-width: 320px; margin: 16px;">
  <img
    mat-card-image
    src="assets/imagens/Veneza.png"
    alt="Imagem de Veneza"
    style="height: 200px; object-fit: cover;"
  >

  <mat-card-content style="padding: 16px;">
    <div style="text-align: center;">
      <h2 style="margin: 0 0 8px 0; color: #333;">Veneza</h2>
      <h3 style="margin: 0; color: #4CAF50; font-weight: 500;">R$ 500</h3>
    </div>
  </mat-card-content>

  <mat-card-actions style="justify-content: center; padding: 0 16px 16px 16px;">
    <button mat-raised-button color="primary">
      VER DETALHES
    </button>
  </mat-card-actions>
</mat-card>
